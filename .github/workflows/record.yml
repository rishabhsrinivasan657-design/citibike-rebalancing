# Records Citi Bike station data around the clock (see docs/DESIGN.md).
# Each run records for 2 h 45 m. 15 minutes before it ends, its "relay" job starts
# the next run itself, so recording doesn't depend on GitHub's scheduler (which
# skipped two runs on 2026-10-19). The schedule below is only a backup.
name: record

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to record"
        default: "165"

permissions:
  contents: read
  actions: write # lets the run re-enable its own schedule (see keep-alive step)

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev

      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows after 60 days without repo activity.
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/record.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Record
        run: uv run recorder --minutes "${{ inputs.minutes || '165' }}"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ vars.HF_REPO }}
          LAKE_URI: ./lake-pending

      - name: Save files that failed to upload
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lake-pending-${{ github.run_id }}
          path: lake-pending/
          retention-days: 7
          if-no-files-found: ignore

  relay:
    # Starts the next run shortly before this one ends. Skipped for short test runs,
    # and skipped if another recent run is already in progress (so chains never multiply).
    if: ${{ (inputs.minutes || '165') >= 60 }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Wait until 15 minutes before the recording ends
        run: sleep $(( (${{ inputs.minutes || '165' }} - 15) * 60 ))
      - name: Start the next run unless one is already covering
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '-120 minutes' +%Y-%m-%dT%H:%M:%SZ)
          others=$(gh run list --workflow record.yml --limit 20 \
            --json databaseId,status,createdAt \
            -q "[.[] | select(.databaseId != ${{ github.run_id }})
                 | select(.status == \"in_progress\" or .status == \"queued\")
                 | select(.createdAt > \"$cutoff\")] | length")
          if [ "$others" -gt 0 ]; then
            echo "Another recent run is already recording; not starting one."
          else
            gh workflow run record.yml
            echo "Started the next run."
          fi
