# Step 5: plan van moves for a real zone and time, using live bike counts and the
# station-hour profile from the history dataset. The move list appears on the run's
# summary page. Start it with:
#   gh workflow run plan.yml -f start=08:00 -f vans=3
#   gh workflow run plan.yml -f at="2026-10-20 08:00"   # a recorded morning
name: plan

on:
  workflow_dispatch:
    inputs:
      zone:
        description: "Zone"
        default: "midtown"
      start:
        description: "Start time (HH:MM, New York time)"
        default: "08:00"
      day_type:
        description: "weekday or weekend"
        default: "weekday"
      vans:
        description: "Number of vans"
        default: "3"
      at:
        description: "Use recorded bike counts at this New York time, YYYY-MM-DD HH:MM (optional)"
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: >-
          uv run plan-moves --zone "${{ inputs.zone }}" --start "${{ inputs.start }}"
          --day-type "${{ inputs.day_type }}" --vans "${{ inputs.vans }}"
          ${{ inputs.at && format('--at "{0}"', inputs.at) || '' }}
          --save-instance instance.json
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HISTORY_REPO: ${{ vars.HF_HISTORY_REPO || 'citibike-history' }}
      - uses: actions/upload-artifact@v4
        with:
          name: planning-problem
          path: instance.json
          retention-days: 30
