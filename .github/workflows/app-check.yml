# Runs the Streamlit app page against live data and the real model, headless.
#   gh workflow run app-check.yml
name: app-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra app
      - run: uv run pytest -m app_live -s
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HISTORY_REPO: ${{ vars.HF_HISTORY_REPO || 'citibike-history' }}
