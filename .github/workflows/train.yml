# Step 4: train the station-hour demand model on 12 months of trips and test it on
# a month it never saw. Pushes the model to models/ in the history dataset.
# Runs weekly, or by hand:  gh workflow run train.yml
name: train

on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_REPO: ${{ vars.HF_REPO || 'citibike-station-status' }}
  HF_HISTORY_REPO: ${{ vars.HF_HISTORY_REPO || 'citibike-history' }}
  DUCKDB_MEMORY_LIMIT: 10GB
  DUCKDB_THREADS: "4"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - name: Download trips, weather and holidays
        run: uv run warehouse pull --work work
      - name: Train and test
        run: uv run forecast-train --raw work/raw --lake work/lake --out work/models
      - name: Save model to Hugging Face
        run: uv run warehouse push-models --work work
