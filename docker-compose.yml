services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  collector:
    build: .
    command: collector
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  lake-sink:
    build: .
    command: lake-sink
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      LAKE_URI: /lake
      SINK_FLUSH_INTERVAL_S: ${SINK_FLUSH_INTERVAL_S:-300}
    volumes:
      - ./data/lake:/lake
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redpanda-data:
