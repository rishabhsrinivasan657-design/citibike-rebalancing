[project]
name = "rebalancer"
version = "0.1.0"
description = "Citi Bike stock-out forecasting, rebalancing optimization, and backtesting"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.6",
    "duckdb>=1.1",
    "holidays>=0.60",
    "httpx>=0.27",
    "huggingface-hub>=0.25",
    "numpy>=2.0",
    "pulp>=2.9,<3",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
]
transform = [
    "dbt-core>=1.9,<1.11",
    "dbt-duckdb>=1.9,<1.11",
]

[project.scripts]
collector = "rebalancer.ingest.collector:main"
lake-sink = "rebalancer.ingest.sink:main"
recorder = "rebalancer.ingest.recorder:main"
coverage-report = "rebalancer.quality.coverage:main"
backfill = "rebalancer.backfill.cli:main"
plan-moves = "rebalancer.planner.run:main"
warehouse = "rebalancer.warehouse:main"
backtest = "rebalancer.backtest.run:main"
backtest-all = "rebalancer.backtest.run:main_all"
okf-validate = "rebalancer.okf.validate:main"
okf-generate = "rebalancer.okf.generate:main"
forecast-train = "rebalancer.forecast.train:main"

[project.optional-dependencies]
app = [
    "pydeck>=0.9",
    "streamlit>=1.39",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rebalancer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real Citi Bike GBFS feed",
    "integration: needs the docker compose stack running",
    "dbt: builds the dbt project on a tiny dataset (needs the transform group)",
    "app_live: runs the real app on live data (needs HF_TOKEN and the app extra)",
]
addopts = "-m 'not live and not integration and not dbt and not app_live'"
